<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#B83A0B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2328"/><stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A1A02" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="430" r="380" fill="#FFFFFF" opacity="0.07"/>
  <!-- easel legs -->
  <g stroke="#2A1206" stroke-width="34" stroke-linecap="round" opacity="0.9">
    <line x1="430" y1="700" x2="330" y2="905"/>
    <line x1="594" y1="700" x2="694" y2="905"/>
    <line x1="512" y1="700" x2="512" y2="880"/>
  </g>
  <!-- tablet -->
  <g filter="url(#sh)">
    <rect x="262" y="170" width="500" height="560" rx="64" fill="#0E1012"/>
    <rect x="290" y="198" width="444" height="504" rx="40" fill="url(#screen)"/>
  </g>
  <!-- QR card -->
  <rect x="352" y="248" width="320" height="320" rx="34" fill="#FFFFFF"/>
  <g fill="#14161A">
    <rect x="384" y="280" width="84" height="84" rx="14"/><rect x="556" y="280" width="84" height="84" rx="14"/><rect x="384" y="452" width="84" height="84" rx="14"/>
  </g>
  <g fill="#FFFFFF"><rect x="400" y="296" width="52" height="52" rx="8"/><rect x="572" y="296" width="52" height="52" rx="8"/><rect x="400" y="468" width="52" height="52" rx="8"/></g>
  <g fill="#14161A"><rect x="414" y="310" width="24" height="24" rx="4"/><rect x="586" y="310" width="24" height="24" rx="4"/><rect x="414" y="482" width="24" height="24" rx="4"/>
    <rect x="490" y="290" width="28" height="28" rx="5"/><rect x="490" y="336" width="28" height="28" rx="5"/><rect x="490" y="400" width="28" height="28" rx="5"/>
    <rect x="530" y="400" width="28" height="28" rx="5"/><rect x="600" y="400" width="28" height="28" rx="5"/><rect x="394" y="400" width="28" height="28" rx="5"/>
    <rect x="490" y="460" width="28" height="28" rx="5"/><rect x="556" y="460" width="28" height="28" rx="5"/><rect x="612" y="508" width="28" height="28" rx="5"/><rect x="530" y="508" width="28" height="28" rx="5"/>
  </g>
